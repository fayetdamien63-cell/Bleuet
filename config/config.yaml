# Configuration Bleuet. Toutes les valeurs peuvent être surchargées par une
# variable d'environnement BLEUET_<SECTION>_<CLE> (ex: BLEUET_STT_MODEL=small).

audio:
  sample_rate: 16000          # imposé par openWakeWord ET par Whisper
  channels: 1
  input_device: null          # index sounddevice, null = périphérique par défaut
  output_device: null
  # Fin d'enregistrement : on coupe après `silence_duration` s de silence,
  # ou au bout de `max_duration` s quoi qu'il arrive.
  max_duration: 12.0
  silence_duration: 1.2
  min_duration: 0.8
  silence_threshold: 0.012    # RMS normalisé ; à ajuster selon le micro

wakeword:
  enabled: true
  # Chemin vers un .onnx custom (ex: data/models/dis_bleuet.onnx).
  # null = modèle pré-entraîné openWakeWord nommé ci-dessous.
  model_path: null
  pretrained_model: hey_jarvis
  threshold: 0.5
  cooldown: 2.0               # s d'attente après un déclenchement
  vad_threshold: 0.0          # 0 = désactivé (le VAD de openWakeWord coûte du CPU)

stt:
  backend: faster_whisper     # faster_whisper | mock
  model: small                # tiny | base | small | medium | large-v3
  language: fr
  compute_type: int8          # int8 sur CPU, float16 si GPU
  beam_size: 1
  mock_text: "Quelle est la météo aujourd'hui ?"

tts:
  backend: piper              # piper | console
  # Binaire piper (ou "piper" s'il est dans le PATH).
  binary: piper
  voice: data/models/fr_FR-siwis-medium.onnx
  length_scale: 1.0
  play: true                  # false = écrit juste un .wav

llm:
  model: claude-opus-5
  max_tokens: 800
  effort: low                 # low|medium|high|xhigh|max ; low = réponse rapide
  timeout: 30.0

rag:
  enabled: true
  db_path: data/rag.sqlite3
  docs_dir: data/knowledge
  top_k: 3
  chunk_chars: 700

context:
  weather_provider: mock      # mock | openweathermap
  calendar_provider: ics      # ics | mock
  calendar_path: data/calendar/famille.ics
  schedules_dir: data/schedules
  timezone: Europe/Paris

server:
  host: 127.0.0.1
  port: 8000
